aid: radia
name: Radia
description: 'Radia is a dual-use aerospace company founded in 2016 by MIT-trained
  aerospace engineer Mark Lundstrom, headquartered in Boulder, Colorado with a second
  operating base in Italy led by Giuseppe Giordo. After roughly seven years in stealth
  the company emerged in March 2024 with WindRunner, an aircraft it describes as the
  largest ever built: roughly ten times the cargo volume of a Boeing 777, sized to
  carry onshore wind turbine blades of up to about 105 metres, and designed to land
  on semi-prepared packed-dirt or gravel strips so that oversized cargo can be flown
  directly to a wind farm, a forward operating site or a disaster zone rather than
  trucked over highways it cannot fit on. Radia frames WindRunner as a deliberately
  low-novelty airframe assembled from existing certified technologies to shorten the
  certification path, targeting entry into service in the early 2030s across three
  markets: energy (delivering the very large blades that make low-wind onshore sites
  economic), defense (outsized-volume strategic airlift), and commercial supply-chain
  logistics. It has assembled an industrial ecosystem of more than twenty suppliers
  and technology partners including Aernnova, Leonardo, AFuzion, Atitech, Latecoere,
  Stirling Dynamics, Collier Aerospace and Maximus Air, and has raised roughly USD
  128 million from investors including ConocoPhillips, Lauder Partners, LS Power Development
  and HCVC. Radia is an aircraft manufacturer and logistics operator rather than a
  software vendor: as of August 2026 it publishes no developer portal, no API documentation,
  no SDK and no machine-readable API contract of any kind. Its only machine-readable
  public surface is the Strapi headless-CMS backend at radia.com/strapi that renders
  its own marketing site, whose content API is permission-locked and undocumented.'
