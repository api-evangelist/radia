generated: '2026-08-02'
method: searched
source: Radia public statements and aviation trade press (2026-08-02 web search)
scope: >-
  Radia publishes no API, so there are no API or cross-cutting technical standards to
  assert. What Radia is actually measured against is civil aviation type certification
  for the WindRunner airframe. That regime is recorded here as applicable with its
  status stated honestly as in-progress rather than achieved. The API/protocol block
  is recorded as not-applicable rather than false, so this file is never mistaken for
  a compliance posture the company does not claim.
regulatory_regime:
- id: faa-part-25-type-certification
  name: FAA type certification for a transport-category aircraft (14 CFR Part 25)
  conforms: false
  status: in-progress
  evidence: >-
    Radia states it is collaborating with the FAA on a multi-level basis through
    WindRunner development, and employs a VP of regulatory affairs (Mel Johnson) whose
    career was spent on FAA certification projects. As of mid-2026 the company targets
    first certification flights in 2030 and commercial operation in 2031. No type
    certificate has been issued, and no aircraft of WindRunner's size or with its
    semi-prepared-strip landing capability has previously been certified.
  note: >-
    conforms:false records that certification has not been granted, not that a check
    was failed. Re-probe on the next pass.
- id: easa-type-certification
  name: EASA type certification (validation pathway alongside the FAA)
  conforms: false
  status: anticipated
  evidence: >-
    Radia operates a second base in Italy and its supplier ecosystem is heavily
    European (Aernnova, Leonardo, Atitech, Latecoere, Stirling Dynamics). Trade
    coverage of its Collier Aerospace tool selection describes the intent to shorten
    both FAA and EASA certification. No EASA application or validation milestone has
    been published.
- id: do-178c-do-254
  name: RTCA DO-178C / DO-254 airborne software and hardware assurance
  conforms: false
  applicable: true
  status: unknown
  evidence: >-
    Radia has partnered with AFuzion, a firm whose practice is DO-178C/DO-254
    certification consulting, which implies these standards are in scope for the
    program. Radia itself has published no conformance statement, so this is recorded
    as applicable-but-unevidenced rather than conforming.
