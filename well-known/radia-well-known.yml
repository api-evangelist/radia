  - path: /robots.txt
    status: 200
    note: >-
      Three lines - "User-agent: * / Allow: /", a Host directive and a Sitemap
      directive. No AI-crawler block list; every crawler is allowed everywhere.
  - path: /sitemap.xml
    status: 200
    note: >-
      Valid XML but the <loc> values are malformed - every URL is emitted as
      "https:///" or "https:////about", i.e. the origin is missing from the template.
      Recorded as an observed defect on Radia's side, not a fetch problem.
  - path: /site.webmanifest
    status: 200
    note: PWA manifest (name "Radia", two android-chrome icons). Not an API artifact.
- host: https://www.radia.com
  note: >-
    resolves (167.172.131.52) and returns identical results to the apex host on every
