generated: '2026-08-02'
method: probed
source: live probes of /.well-known/ and contract-discovery paths on Radia hosts (2026-08-02)
result: >-
  none - Radia publishes no /.well-known/ document and no machine-readable API contract
  on any host it controls. radia.com is a Next.js marketing site rendered from a Strapi
  headless CMS; the Strapi backend is reachable at radia.com/strapi but its content
  API is permission-locked and undocumented, and it is not offered as a product.
