strapi_backend:
  observed: true
  base: https://radia.com/strapi
  evidence:
  - path: /strapi/
    status: 200
    note: default "Welcome to your Strapi app" landing page
  - path: /strapi/admin
    status: 200
    note: Strapi admin single-page app, served with meta robots=noindex
  - path: /strapi/api/global
    status: 403
    note: >-
      Forbidden with a Strapi JSON error body - the collection exists but the public
      role has no find permission. This is the strongest evidence a content API is
      present.
  - path: /strapi/api
    status: 404
  - path: /strapi/api/{articles,pages,posts,media-items,press-releases,partners,leaders,team-members,navigation,home,homepage}
    status: 404
    note: none of these collection names exist
  - path: /strapi/documentation
    status: 404
  - path: /strapi/documentation/v1.0.0/full_documentation.json
    status: 404
    note: >-
      the Strapi Documentation plugin (which would emit an OpenAPI document) is not
      installed, so no generated OpenAPI is available
  - path: /strapi/graphql
    status: 404
    note: the Strapi GraphQL plugin is not installed
  assessment: >-
    This is the CMS that renders radia.com, not a published API product. It is
    undocumented, has no developer portal, no authentication documentation, no terms
    covering third-party use, and its collections return 403/404 anonymously. It is
    recorded here as an observed internal surface only. No apis[] entry, no OpenAPI
    and no MCP artifact is derived from it - doing so would fabricate a product Radia
    does not offer.
